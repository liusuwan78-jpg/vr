name: Unity Android Build (debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Unity Cache (optional)
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-unity-cache-${{ hashFiles('**/Packages/manifest.json') }}

      - name: Build with game-ci/unity-builder
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2021.3.0f1
          targetPlatform: Android
          buildName: Build/VRPlayer.apk
          androidBuildMode: "Debug"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrplayer-apk
          path: Build/VRPlayer.apk
